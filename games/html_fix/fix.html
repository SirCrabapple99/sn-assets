<!doctype html><body><script>const LAUNCHER_APP_SOURCE="\nconst DB_NAME = 'payload_db';\nconst STORE = 'blobs';\n\nfunction openDb() {\n    return new Promise((resolve, reject) => {\n        const req = indexedDB.open(DB_NAME, 1);\n        req.onupgradeneeded = () => req.result.createObjectStore(STORE);\n        req.onsuccess = () => resolve(req.result);\n        req.onerror = () => reject(req.error);\n    });\n}\nfunction getBlob(db, k) {\n    return new Promise((resolve, reject) => {\n        const tx = db.transaction(STORE, 'readonly');\n        const req = tx.objectStore(STORE).get(k);\n        req.onsuccess = () => resolve(req.result);\n        req.onerror = () => reject(req.error);\n    });\n}\nfunction putBlob(db, k, buf) {\n    return new Promise((resolve, reject) => {\n        const tx = db.transaction(STORE, 'readwrite');\n        tx.objectStore(STORE).put(buf, k);\n        tx.oncomplete = resolve;\n        tx.onerror = () => reject(tx.error);\n    });\n}\nfunction deleteBlob(db, k) {\n    return new Promise((resolve, reject) => {\n        const tx = db.transaction(STORE, 'readwrite');\n        const store = tx.objectStore(STORE);\n        store.delete(k);\n        store.delete('meta_' + k);\n        tx.oncomplete = resolve;\n        tx.onerror = () => reject(tx.error);\n    });\n}\nfunction listKeys(db) {\n    return new Promise((resolve, reject) => {\n        const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAllKeys();\n        req.onsuccess = () => resolve(\n            req.result.filter(k => typeof k === 'string' && k.startsWith('k_')).sort().reverse()\n        );\n        req.onerror = () => reject(req.error);\n    });\n}\nfunction loadAndRun(buf) {\n    const text = new TextDecoder().decode(buf);\n    document.open();\n    document.write(text);\n    document.close();\n}\n\nfunction dumpAllIndexedDb() {\n    return new Promise(async (resolve, reject) => {\n        try {\n            let dbList = [];\n            if (indexedDB.databases) {\n                dbList = await indexedDB.databases();\n            } else {\n                dbList = [{ name: DB_NAME }];\n            }\n\n            const result = {};\n            for (const info of dbList) {\n                const name = info.name;\n                if (!name) continue;\n                const db = await new Promise((res, rej) => {\n                    const req = indexedDB.open(name);\n                    req.onsuccess = () => res(req.result);\n                    req.onerror = () => rej(req.error);\n                });\n\n                const storesData = {};\n                const storeNames = Array.from(db.objectStoreNames);\n                for (const storeName of storeNames) {\n                    const records = await new Promise((res, rej) => {\n                        const tx = db.transaction(storeName, 'readonly');\n                        const store = tx.objectStore(storeName);\n                        const entries = [];\n                        const cursorReq = store.openCursor();\n                        cursorReq.onsuccess = (e) => {\n                            const cursor = e.target.result;\n                            if (cursor) {\n                                entries.push({ key: cursor.key, value: cursor.value });\n                                cursor.continue();\n                            } else {\n                                res(entries);\n                            }\n                        };\n                        cursorReq.onerror = () => rej(cursorReq.error);\n                    });\n                    storesData[storeName] = records;\n                }\n                result[name] = { version: db.version, stores: storesData };\n                db.close();\n            }\n            resolve(result);\n        } catch (e) {\n            reject(e);\n        }\n    });\n}\n\nfunction bufferToBase64(buf) {\n    const bytes = new Uint8Array(buf);\n    let binary = '';\n    const chunk = 0x8000;\n    for (let i = 0; i < bytes.length; i += chunk) {\n        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));\n    }\n    return btoa(binary);\n}\nfunction base64ToBuffer(b64) {\n    const binary = atob(b64);\n    const bytes = new Uint8Array(binary.length);\n    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);\n    return bytes.buffer;\n}\n\nfunction encodeValue(v) {\n    if (v instanceof ArrayBuffer) {\n        return { __type: 'ArrayBuffer', data: bufferToBase64(v) };\n    }\n    if (ArrayBuffer.isView(v)) {\n        return { __type: 'ArrayBuffer', data: bufferToBase64(v.buffer) };\n    }\n    if (Array.isArray(v)) {\n        return v.map(encodeValue);\n    }\n    if (v && typeof v === 'object') {\n        const out = {};\n        for (const k in v) out[k] = encodeValue(v[k]);\n        return out;\n    }\n    return v;\n}\nfunction decodeValue(v) {\n    if (v && typeof v === 'object' && v.__type === 'ArrayBuffer') {\n        return base64ToBuffer(v.data);\n    }\n    if (Array.isArray(v)) {\n        return v.map(decodeValue);\n    }\n    if (v && typeof v === 'object') {\n        const out = {};\n        for (const k in v) out[k] = decodeValue(v[k]);\n        return out;\n    }\n    return v;\n}\n\nasync function downloadFullBackup() {\n    const idbDump = await dumpAllIndexedDb();\n    const encodedIdb = encodeValue(idbDump);\n    const backup = {\n        format: 'launcher_full_backup_v1',\n        createdAt: new Date().toISOString(),\n        localStorage: { ...localStorage },\n        indexedDb: encodedIdb\n    };\n    const json = JSON.stringify(backup);\n    const blob = new Blob([json], { type: 'application/json' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'full_backup_' + Date.now() + '.json';\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    URL.revokeObjectURL(a.href);\n}\n\nasync function restoreFullBackup(file) {\n    const text = await file.text();\n    const backup = JSON.parse(text);\n    if (backup.format !== 'launcher_full_backup_v1') {\n        throw new Error('Unrecognized backup file format');\n    }\n\n    for (const k in backup.localStorage) {\n        localStorage.setItem(k, backup.localStorage[k]);\n    }\n\n    const idbData = decodeValue(backup.indexedDb);\n    for (const dbName in idbData) {\n        const dbInfo = idbData[dbName];\n        const storeNames = Object.keys(dbInfo.stores);\n\n        const db = await new Promise((resolve, reject) => {\n            const req = indexedDB.open(dbName, dbInfo.version || 1);\n            req.onupgradeneeded = () => {\n                const d = req.result;\n                for (const storeName of storeNames) {\n                    if (!d.objectStoreNames.contains(storeName)) {\n                        d.createObjectStore(storeName);\n                    }\n                }\n            };\n            req.onsuccess = () => resolve(req.result);\n            req.onerror = () => reject(req.error);\n        });\n\n        for (const storeName of storeNames) {\n            const records = dbInfo.stores[storeName];\n            await new Promise((resolve, reject) => {\n                const tx = db.transaction(storeName, 'readwrite');\n                const store = tx.objectStore(storeName);\n                for (const rec of records) {\n                    store.put(rec.value, rec.key);\n                }\n                tx.oncomplete = resolve;\n                tx.onerror = () => reject(tx.error);\n            });\n        }\n        db.close();\n    }\n}\n\nfunction buildBackupOverlay() {\n    if (document.getElementById('__backup_overlay__')) return;\n\n    const overlay = document.createElement('div');\n    overlay.id = '__backup_overlay__';\n    overlay.style.cssText =\n        'position:fixed;top:0;left:0;width:100%;height:100%;' +\n        'background:rgba(0,0,0,0.75);z-index:2147483647;' +\n        'display:flex;align-items:center;justify-content:center;' +\n        'font-family:sans-serif;';\n\n    const box = document.createElement('div');\n    box.style.cssText =\n        'background:#fff;padding:24px;border-radius:8px;max-width:420px;width:90%;';\n\n    box.innerHTML =\n        '<h3 style=\"margin-top:0;\">Backup / Restore</h3>' +\n        '<p style=\"font-size:13px;color:#555;\">Saves and uploaded files stored in this browser profile. Restoring only works in this same browser/profile.</p>' +\n        '<button id=\"__bk_download__\" style=\"width:100%;padding:8px;margin-bottom:10px;\">Download full backup</button>' +\n        '<div style=\"margin-bottom:10px;\">' +\n        '<label style=\"font-size:13px;\">Restore from backup file:</label><br>' +\n        '<input type=\"file\" id=\"__bk_restore_file__\" accept=\".json\">' +\n        '</div>' +\n        '<div id=\"__bk_status__\" style=\"font-size:13px;color:#333;min-height:18px;\"></div>' +\n        '<button id=\"__bk_close__\" style=\"width:100%;padding:8px;margin-top:10px;\">Close</button>';\n\n    overlay.appendChild(box);\n    document.body.appendChild(overlay);\n\n    const status = box.querySelector('#__bk_status__');\n\n    box.querySelector('#__bk_download__').addEventListener('click', async () => {\n        status.textContent = 'Building backup...';\n        try {\n            await downloadFullBackup();\n            status.textContent = 'Backup downloaded.';\n        } catch (e) {\n            status.textContent = 'FAIL: ' + e.message;\n        }\n    });\n\n    box.querySelector('#__bk_restore_file__').addEventListener('change', async (e) => {\n        const file = e.target.files[0];\n        if (!file) return;\n        status.textContent = 'Restoring...';\n        try {\n            await restoreFullBackup(file);\n            status.textContent = 'Restored. Reload the page to see changes.';\n        } catch (err) {\n            status.textContent = 'FAIL: ' + err.message;\n        }\n    });\n\n    box.querySelector('#__bk_close__').addEventListener('click', () => {\n        overlay.remove();\n    });\n}\n\ndocument.addEventListener('keydown', (e) => {\n    if (e.ctrlKey && e.altKey && (e.key === 'b' || e.key === 'B')) {\n        e.preventDefault();\n        const existing = document.getElementById('__backup_overlay__');\n        if (existing) {\n            existing.remove();\n        } else {\n            buildBackupOverlay();\n        }\n    }\n});\n\nasync function renderHome(db) {\n    const body = document.body;\n    body.innerHTML =\n        '<h3>Upload a game/HTML file</h3>' +\n        '<input type=\"file\" id=\"fi\" accept=\".html,.htm\">' +\n        '<h3>Stored files</h3><div id=\"list\"></div>' +\n        '<p style=\"font-size:12px;color:#666;\">Press Ctrl+Alt+B anytime for backup/restore.</p>';\n\n    const list = document.getElementById('list');\n    const keys = await listKeys(db);\n\n    if (!keys.length) {\n        list.textContent = 'Nothing stored.';\n    } else {\n        for (const k of keys) {\n            const meta = await getBlob(db, 'meta_' + k);\n            const label = meta ? meta.name : k;\n\n            const row = document.createElement('div');\n            row.style.cssText = 'margin:6px 0;';\n\n            const name = document.createElement('span');\n            name.textContent = label;\n            name.style.marginRight = '10px';\n\n            const open = document.createElement('button');\n            open.textContent = 'Open';\n            open.addEventListener('click', async () => {\n                const buf = await getBlob(db, k);\n                if (buf) loadAndRun(buf);\n            });\n\n            const del = document.createElement('button');\n            del.textContent = 'Delete';\n            del.style.marginLeft = '6px';\n            del.addEventListener('click', async () => {\n                if (!confirm('Delete ' + label + '? Links and wrapped files using it will stop working.')) return;\n                await deleteBlob(db, k);\n                renderHome(db);\n            });\n\n            row.append(name, open, del);\n            list.appendChild(row);\n        }\n\n        const all = document.createElement('button');\n        all.textContent = 'Delete all';\n        all.style.marginTop = '10px';\n        all.addEventListener('click', async () => {\n            if (!confirm('Delete ALL ' + keys.length + ' stored files?')) return;\n            for (const k of keys) await deleteBlob(db, k);\n            renderHome(db);\n        });\n        list.appendChild(all);\n    }\n\n    document.getElementById('fi').addEventListener('change', async (e) => {\n        const file = e.target.files[0];\n        if (!file) return;\n        const buf = await file.arrayBuffer();\n        const newKey = 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);\n        await putBlob(db, newKey, buf);\n        await putBlob(db, 'meta_' + newKey, { name: file.name, size: file.size, added: Date.now() });\n\n        const shareUrl = basePath + '?key=' + newKey;\n\n        body.innerHTML =\n            '<h3></h3>' +\n            '<p>Link:</p><input type=\"text\" readonly style=\"width:100%\" id=\"su\">' +\n            '<p><a href=\"' + shareUrl + '\">Open it</a></p>' +\n            '<p><button id=\"dl\">Download a double-click file for this</button> ' +\n            '<button id=\"back\">Back to list</button></p>' +\n            '<p style=\"font-size:12px;color:#666;\">Press Ctrl+Alt+B anytime for backup/restore.</p>';\n        body.querySelector('h3').textContent = 'Uploaded: ' + file.name;\n        document.getElementById('su').value = shareUrl;\n\n        document.getElementById('back').addEventListener('click', () => renderHome(db));\n\n        document.getElementById('dl').addEventListener('click', () => {\n            const wrapperSource = buildWrapperHtml(newKey, basePath);\n            const wrappedName = file.name.replace(/\\.html?$/i, '') + '_wrapped.html';\n            const blob = new Blob([wrapperSource], { type: 'text/html' });\n            const a = document.createElement('a');\n            a.href = URL.createObjectURL(blob);\n            a.download = wrappedName;\n            document.body.appendChild(a);\n            a.click();\n            a.remove();\n            URL.revokeObjectURL(a.href);\n        });\n    });\n}\n\n(async () => {\n    const body = document.body;\n    try {\n        const db = await openDb();\n\n        if (key) {\n            const buf = await getBlob(db, key);\n            if (!buf) {\n                body.textContent = 'FAIL: no data for key ' + key;\n                return;\n            }\n            loadAndRun(buf);\n            return;\n        }\n\n        await renderHome(db);\n    } catch (e) {\n        body.textContent = 'FAIL: ' + e.name + ': ' + e.message;\n    }\n})();\n";function safeForScript(e){return e.replace(/<\/script/gi,"<\\/script")}function buildLauncherHtml(e,n,t){var o=t?'window.onload = async () => { const x = await fetch("https://cdn.jsdelivr.net/npm/eruda"); eval(await x.text()); document.addEventListener("keydown", (e) => { if (e.code === "KeyP") eruda.init(); } );};\n':"",r=[safeForScript,buildLauncherHtml,buildWrapperHtml].map(function(e){return e.toString()}).join("\n");return"<!DOCTYPE html><html><body><script>"+safeForScript(o+"const key = "+JSON.stringify(e)+";\nconst basePath = "+JSON.stringify(n)+";\nconst LAUNCHER_APP_SOURCE = "+JSON.stringify(LAUNCHER_APP_SOURCE)+";\n"+r+"\n"+LAUNCHER_APP_SOURCE)+"\n<\/script></body></html>"}function buildWrapperHtml(e,n){var t=buildLauncherHtml(e,n,!1);return'<!DOCTYPE html><html><body><script>if (!window.opener) {var tab = window.open("about:blank", "_blank");if (tab) {tab.document.write('+safeForScript(JSON.stringify(t))+");tab.document.close();window.close();}}<\/script></body></html>"}if(!window.opener){var url=new URL(window.location.href),keyVal=url.searchParams.get("key"),basePathVal=url.origin+url.pathname,tab=window.open("about:bl
